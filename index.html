<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMAMB — منصة المعلم والطالب | Teacher & Student Platform</title>
<meta name="description" content="Multi-school platform for teachers, students and admins: attendance QR, gradebook, behavior, homework, leaderboard, reports, plans, certificates." />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ══════ AMAMB logo (reusable flask mark) ══════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="amambFlask" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="amambFlaskLiquid" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fbbf24"/>
        <stop offset=".5" stop-color="#f97316"/>
        <stop offset="1" stop-color="#c2410c"/>
      </linearGradient>
    </defs>
    <path d="M25.5 9h13v5.5l-2.3 2.3V27L48 46a5.6 5.6 0 0 1-4.9 8.2H20.9A5.6 5.6 0 0 1 16 46l11.8-19v-10.2L25.5 14.5V9z"
          fill="rgba(255,255,255,.18)" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M23.6 37.5h16.8l6.9 11.1a3.3 3.3 0 0 1-2.9 5H19.6a3.3 3.3 0 0 1-2.9-5l6.9-11.1z" fill="url(#amambFlaskLiquid)"/>
    <circle cx="28.5" cy="46.5" r="1.7" fill="#ffffff" opacity=".95"/>
    <circle cx="36.5" cy="43" r="1.2" fill="#ffffff" opacity=".8"/>
    <circle cx="38" cy="49.5" r="2" fill="#ffffff" opacity=".7"/>
    <rect x="21.5" y="6" width="21" height="4.6" rx="2.3" fill="#ffffff"/>
  </symbol>
</svg>

<!-- ══════════ LOGIN VIEW ══════════ -->
<div id="loginView" class="login-view">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="brand big">
      <div class="brand-mark"><svg class="logo-svg" viewBox="0 0 64 64" role="img" aria-label="AMAMB logo"><use href="#amambFlask"></use></svg></div>
      <div>
        <div class="brand-name">AMAMB</div>
        <div class="brand-sub" data-i18n="brandSub">منصة المعلم والتعلّم</div>
      </div>
    </div>
    <h1 data-i18n="welcome">أهلاً بك 👋</h1>
    <p class="muted" data-i18n="signinToContinue">سجّل دخولك للمتابعة</p>

    <form id="loginForm" autocomplete="on">
      <label for="loginEmail" data-i18n="email">البريد الإلكتروني</label>
      <input id="loginEmail" type="email" required dir="ltr" placeholder="you@school.com" autocomplete="username" />

      <label for="loginPassword" data-i18n="password">كلمة المرور</label>
      <input id="loginPassword" type="password" required dir="ltr" placeholder="••••••••" autocomplete="current-password" />

      <button type="submit" class="btn primary block lg" id="loginBtn">
        <span data-i18n="signIn">تسجيل الدخول</span>
      </button>
      <div id="loginError" class="error-text hidden"></div>
    </form>

    <button class="btn ghost block" id="langToggleLogin" style="margin-top:10px">🌐 العربية / English</button>

    <div class="demo-box">
      <div class="demo-title" data-i18n="demoAccounts">حسابات تجريبية (اضغط للتعبئة)</div>
      <div class="demo-chips">
        <button type="button" class="demo-chip" data-email="admin@amamb.com" data-pass="admin123">👑 <b>Admin</b> admin@amamb.com</button>
        <button type="button" class="demo-chip" data-email="teacher@amamb.com" data-pass="teacher123">🧑‍🏫 <b>Teacher</b> teacher@amamb.com</button>
        <button type="button" class="demo-chip" data-email="student@amamb.com" data-pass="student123">🎒 <b>Student</b> student@amamb.com</button>
      </div>
    </div>
    <div class="login-foot">AMAMB © 2026 · Al-Noor International School</div>
  </div>
</div>

<!-- ══════════ MAIN APP SHELL ══════════ -->
<div id="appView" class="app-view hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg class="logo-svg" viewBox="0 0 64 64" role="img" aria-label="AMAMB logo"><use href="#amambFlask"></use></svg></div>
      <div>
        <div class="brand-name">AMAMB</div>
        <div class="brand-sub" id="sideSchoolName">—</div>
      </div>
    </div>
    <nav class="nav" id="navMenu"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">؟</div>
        <div class="user-meta">
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="btn ghost small block" id="logoutBtn">⎋ <span data-i18n="signOut">تسجيل الخروج</span></button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarToggle" aria-label="Menu">☰</button>
      <div class="page-title" id="pageTitle">—</div>
      <div class="topbar-actions">
        <select id="sectionPicker" class="select hidden"></select>
        <button class="btn ghost small" id="langToggle" title="Language">🌐 <span id="langLabel">EN</span></button>
      </div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<!-- ══════════ CHECK-IN RESULT (QR landing) ══════════ -->
<div id="checkinView" class="checkin-view hidden">
  <div class="checkin-card">
    <div class="checkin-emoji" id="checkinEmoji">✅</div>
    <h2 id="checkinTitle">—</h2>
    <p id="checkinSub" class="muted">—</p>
    <button class="btn primary block" id="checkinContinue" data-i18n="continue">متابعة</button>
  </div>
</div>

<!-- Modal + Toast roots -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<div id="printArea" class="print-area"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/scoring.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
<script src="js/teacher.js"></script>
<script src="js/teacher2.js"></script>
<script src="js/teacher3.js"></script>
<script src="js/student.js"></script>
<script src="js/app.js"></script>
</body>
</html>
